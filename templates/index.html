{% extends "layout.html" %}

{% block title %}Home - Vista Blog{% endblock title %}

{% block content %}
<!-- Header -->
<header class="bg-dark text-white text-center py-5 mb-4">
    <div class="container">
        <h1 class="display-4">Welcome to Vista Blog</h1>
        <p class="lead">Sharing ideas,News, stories, and inspiration</p>
    </div>
</header>

<!-- Blog Posts -->
<div class="container">
    <div class="row">
        {% for post in posts %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card shadow-sm h-100">
                <img src="{{ post.postimg.url }}" class="card-img-top" alt="{{ post.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.summary }}</p>
                    <a href="{% url 'blog:detail' post.id %}" class="btn btn-primary">View Detail</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock content %}
